name: Build Gimi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libltdl-dev python3-dev python3-pip openjdk-17-jdk unzip zip
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Auto Generate buildozer.spec & Build APK
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Gimi AI
        package.name = gimi
        package.domain = org.gimi
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy==2.3.0,google-genai,requests,urllib3,certifi
        orientation = portrait
        fullscreen = 0
        android.permissions = INTERNET,RECORD_AUDIO
        android.api = 33
        android.minapi = 21
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        p4a.branch = master
        EOF

        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gimi-AI-App
        path: bin/*.apk
        
